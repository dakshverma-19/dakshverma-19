<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p> this is my first html code </p>
  
    
    <h1>heading</h1>.        <!--  Biggest heading -->
    <h2>heading</h2> 
    <h3>heading</h3>
    <h4>heading</h4>
    <h5>heading</h5>
    <h6>heading</h6>.        <!-- Smallest heading -->    
   
    <br>                     <!-- for giving space-->

    <b>bold</b>
    <i>italic</i>
    <u>underline</u>
    
    <small>size</small>.       <!--for small text -->
    
    <hr>                       <!--for underline-->

    <p>H<sub>2</sub>0</p>                  <!-- for lower small text -->
    <p>A<sup>2</sup>+B<sup>2</sup></p>.    <!-- for upper small text-->

    <pre> hello.     hello  </pre>.         <!-- to print number of spaces -->
     
   <!-- <img src = add your link ,  height="x" width="x" -->
   <!--  alt = "name" this will be shown if link dosent work -->

   <ul>                  <!-- ul = unordered list -->
    <li>apple</li>.      <!-- for unordereed points-->
    <li>mango</li>
   </ul>
 
   <ol>                  <!-- ol= ordered list -->
    <li>apple</li>.      <!-- for ordered list with numbers-->
    <li>mamgo</li>
   </ol>
   

</body>
</html>
